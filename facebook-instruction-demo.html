            var ua = navigator.userAgent || "";
            // 识别 Facebook / Messenger / Instagram 等 Meta 内置容器 (IAB)
            var isFacebookContainer = /FBAN|FBAV|FB_IAB|FBIOS|FB4A|FBSS|Messenger|Instagram|Barcelona/i.test(ua);
            // 支持 ?debug=1 强制在普通浏览器里预览中间页样式
            var isDebugPreview = /[?&]debug=1\b/.test(window.location.search);

                window.location.replace(TARGET_URL);
            }
        })();

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .page-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* 右上角引导浮层 */
        .top-right-guide {
            position: absolute;
            top: 14px;
            right: 16px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            animation: floatUpDown 1.4s ease-in-out infinite;
        }

        .arrow-icon {
            width: 38px;
            height: 38px;
            margin-right: 6px;
            margin-bottom: 6px;
            filter: drop-shadow(0 2px 8px rgba(254, 44, 85, 0.55));
        }

        .guide-bubble {
            background: linear-gradient(135deg, #fe2c55 0%, #e01e45 100%);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 14px;
            border-top-right-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.45;
            max-width: 250px;
            box-shadow: 0 8px 24px rgba(254, 44, 85, 0.35);
        }

        .guide-dots {
            display: inline-block;
            background: rgba(255, 255, 255, 0.22);
            padding: 0 7px;
            border-radius: 6px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        @keyframes floatUpDown {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        /* 中间核心品牌与提示区 */
        .center-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 320px;
        }

        .logo-box {
            width: 84px;
            height: 84px;
            border-radius: 22px;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .logo-box img {
            width: 54px;
            height: 54px;
            object-fit: contain;
        }

        .main-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.2px;
        }

        .sub-title {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.55;
            margin-bottom: 26px;
        }

        .steps-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px 18px;
            text-align: left;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
        }

        .step-item+.step-item {
            margin-top: 12px;
        }

        .step-num {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #25f4ee;
            color: #000000;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <!-- 右上角指示箭头与操作气泡 -->
        <div class="top-right-guide">
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 19V5M12 5L6 11M12 5L18 11" stroke="#FE2C55" stroke-width="2.6" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <div class="guide-bubble">
                Tap <span class="guide-dots">···</span> at top right and select<br>
                <strong>"Open in External Browser"</strong>
            </div>
        </div>
        <!-- 中间 TikTok Logo 与指引标题 -->
        <div class="center-card">
            <div class="logo-box">
                <img src="https://lf16-tiktok-common.ibytedtos.com/obj/tiktok-web-common-sg/mtact/static/images/tiktok-logo/logo.png"
                    alt="TikTok">
            </div>
            <h1 class="main-title">Open in Browser to Watch</h1>
            <p class="sub-title">
                Please open this page in your system browser to continue watching the video on TikTok.
            </p>
            <div class="steps-card">
                <div class="step-item">
                    <span class="step-num">1</span>
                    <span>Tap the <strong>···</strong> menu in the top-right corner</span>
                </div>
                <div class="step-item">
                    <span class="step-num">2</span>
                    <span>Choose <strong>Open in External Browser</strong></span>
                </div>
            </div>
        </div>
    </div>
</body>
